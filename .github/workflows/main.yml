name: Build Tweak

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          
      - name: Install Theos
        run: |
          brew install ldid xz make
          mkdir -p $HOME/theos
          curl -L https://github.com/theos/theos/releases/latest/download/theos.tar.gz -o theos.tar.gz
          tar -xzf theos.tar.gz -C $HOME/theos --strip-components=1
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH
          
      - name: Build
        run: |
          make clean || true
          make package FINALPACKAGE=1
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModMenu-Package
          path: |
            packages/*.deb
            .theos/obj/debug/*.dylib
          if-no-files-found: warn
